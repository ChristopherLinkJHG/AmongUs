services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amongus-server
    environment:
      NODE_ENV: production
      PORT: 2567
    ports:
      - "2567:2567"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2567/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
