services:
  server:
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-bookworm-slim AS build

        WORKDIR /app

        COPY package.json package-lock.json ./
        RUN npm ci

        COPY . .
        RUN npm run build

        FROM node:24-bookworm-slim

        WORKDIR /app

        COPY package.json package-lock.json ./
        RUN npm ci --omit=dev

        COPY server ./server
        COPY shared ./shared
        COPY --from=build /app/dist ./dist

        ENV NODE_ENV=production
        ENV PORT=2567

        EXPOSE 2567

        CMD ["npm", "run", "server"]
    container_name: amongus-server
    environment:
      NODE_ENV: production
      PORT: 2567
      MONITOR_USER: admin
      MONITOR_PASS: change-me
    ports:
      - "2567:2567"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2567/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
